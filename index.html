<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier Grist</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <iframe id ="viewer" src =""></iframe>
    <style>
    body { 
        font-family: Arial, sans-serif; 
        padding: 20px; 
        background-color: #ffffff; }
    .en-tete { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 20px; }
    .grille { display: grid; 
        grid-template-columns: repeat(5, 1fr); gap: 15px; }
    .case-jour { 
        border: 1px solid #e0e0e0; 
        padding: 15px; 
        border-radius: 8px; 
        text-align: center; 
        min-height: 100px; 
        box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
    }
    .passe{
        background-color: #f6f8fa;
        color:#57606a;
    }
    .aujourdhui{
        border: 2px solid #0969da;
        background-color: #ddf4ff;

    }
    .futur{
        background-color: #ffffff;
        opacity: 0.6;
        border-style: dashed;

    }
    .titre-jour { 
        font-weight: bold; 
        margin-bottom: 10px; 
        color: #333; }
    .raccourci { 
        color: #d32f2f; 
        font-weight: bold; 
        font-size: 1.2em; 
        margin-bottom: 5px; }
</style>
</head>
<body>
    <div class="en-tete">
    <h2 id="titre-mois">Calendrier</h2>
</div>

<div class="grille" id="grille-calendrier">
</div class ="case-jour">Chargement en cours...</div> 
    <!-- Les cases seront générées ici par le script -->
</div>

<script>
    // 2. Attendre que l'API Grist soit prête
    grist.ready({requiredAccess: 'full'});

        async function initialiserEtChargerCalendrier() {
        try {
            // 1. Récupération des tables
            let planningData = await grist.docApi.fetchTable('PlannigDiffusion');
            const raccourcisData = await grist.docApi.fetchTable('Raccourcis');

            if (!raccourcisData || raccourcisData.length === 0) {
                document.getElementById('grille-calendrier').innerHTML = "<p>Aucun raccourci trouvé dans la table 'Raccourcis'.</p>";
                return;
            }

            // 2. Si la table PlannigDiffusion est vide, on la remplit automatiquement (Novembre 2026 et suite)
            if (!planningData || planningData.length === 0) {
                document.getElementById('titre-mois').innerText = "Génération automatique du planning...";
                
                let nouveauxEnregistrements = [];
                let annee = 2026;
                let mois = 10; // Novembre (0 à 11)
                let indexRaccourci = 0;

                // Générer les jours ouvrés pour les prochains mois (ex: Novembre et Décembre 2026)
                for (let m = 0; m < 2; m++) {
                    let moisCourant = mois + m;
                    let anneeCourante = annee;
                    if (moisCourant > 11) {
                        moisCourant = 0;
                        anneeCourante++;
                    }

                    let dernierJour = new Date(anneeCourante, moisCourant + 1, 0).getDate();

                    for (let jour = 1; jour <= dernierJour; jour++) {
                        let d = new Date(anneeCourante, moisCourant, jour);
                        let jourSemaine = d.getDay();

                        // Ignorer week-ends
                        if (jourSemaine === 0 || jourSemaine === 6) continue;

                        let raccourciAssigne = raccourcisData[indexRaccourci % raccourcisData.length];
                        indexRaccourci++;

                        let dateStr = `${anneeCourante}-${String(moisCourant + 1).padStart(2, '0')}-${String(jour).padStart(2, '0')}`;

                        nouveauxEnregistrements.push({
                            Rccourci_Cible: raccourciAssigne.id,
                            Date_Diffusion: dateStr
                        });
                    }
                }

                // Insertion automatique dans la table Grist PlannigDiffusion
                await grist.docApi.addRecords('PlannigDiffusion', nouveauxEnregistrements);
                
                // Recharger les données après insertion
                planningData = await grist.docApi.fetchTable('PlannigDiffusion');
            }

            // 3. Affichage du mois de Novembre 2026
            const anneeCible = 2026;
            const moisCible = 10;

            const aujourdhui = new Date();
            aujourdhui.setHours(0,0,0,0);

            const moisNoms = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
            document.getElementById('titre-mois').innerText = moisNoms[moisCible] + " " + anneeCible;

            const conteneurGrille = document.getElementById('grille-calendrier');
            conteneurGrille.innerHTML = "";

            const dernierJourDuMois = new Date(anneeCible, moisCible + 1, 0).getDate();
            let joursSemaine = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];

            const raccourcisMap = {};
            raccourcisData.forEach(r => { raccourcisMap[r.id] = r; });

            // 4. Boucle d'affichage pour Novembre 2026
            for (let jour = 1; jour <= dernierJourDuMois; jour++) {
                const dateCourante = new Date(anneeCible, moisCible, jour);
                dateCourante.setHours(0,0,0,0);

                const jourSemaineNum = dateCourante.getDay();
                if (jourSemaineNum === 0 || jourSemaineNum === 6) continue;

                const caseDiv = document.createElement('div');
                let statutClasse = "case-jour ";
                
                if (dateCourante.getTime() < aujourdhui.getTime()) {
                    statutClasse += "passe";
                } else if (dateCourante.getTime() === aujourdhui.getTime()) {
                    statutClasse += "aujourdhui";
                } else {
                    statutClasse += "futur";
                }
                caseDiv.className = statutClasse;

                let jourTexte = joursSemaine[jourSemaineNum] + " " + jour;
                let htmlContent = `<div class="titre-jour">${jourTexte}</div>`;

                let planningTrouve = planningData.find(p => {
                    let dVal = p.Date_Diffusion || p.DateDiffusion;
                    if (!dVal) return false;
                    let dDate = new Date(typeof dVal === "number" ? dVal * 1000 : dVal);
                    dDate.setHours(0,0,0,0);
                    return dDate.getTime() === dateCourante.getTime();
                });

                if (planningTrouve) {
                    const rId = planningTrouve.Rccourci_Cible || planningTrouve.RaccourciID;
                    const raccourciObj = raccourcisMap[rId];

                    if (raccourciObj) {
                        const combi = raccourciObj.Combinaison || "Raccourci";
                        const desc = raccourciObj.Description || raccourciObj.Remarque || "";
                        htmlContent += `<div class="raccourci">${combi}</div>` +
                                       `<div style="font-size: 0.85em; color: #555;">${desc}</div>`;
                    }
                }

                caseDiv.innerHTML = htmlContent;
                conteneurGrille.appendChild(caseDiv);
            }

        } catch (error) {
            console.error("Erreur :", error);
            document.getElementById('grille-calendrier').innerHTML = "<p>Erreur lors de l'initialisation. Vérifie les noms des tables.</p>";
        }
    }

    initialiserEtChargerCalendrier();

     </script>
        </body>
        </html>
