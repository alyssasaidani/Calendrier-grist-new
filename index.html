<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier Grist</title>
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <iframe id ="viewer" src =""></iframe>
    <style>
    body { 
        font-family: Arial, sans-serif; 
        padding: 20px; 
        background-color: #ffffff; }
    .en-tete { 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        margin-bottom: 20px; }
    .grille { display: grid; 
        grid-template-columns: repeat(5, 1fr); gap: 15px; }
    .case-jour { 
        border: 1px solid #e0e0e0; 
        padding: 15px; 
        border-radius: 8px; 
        text-align: center; 
        min-height: 100px; 
        box-shadow: 2px 2px 5px rgba(0,0,0,0.05);
    }
    .passe{
        background-color: #f6f8fa;
        color:#57606a;
    }
    .aujourdhui{
        border: 2px solid #0969da;
        background-color: #ddf4ff;

    }
    .futur{
        background-color: #ffffff;
        opacity: 0.6;
        border-style: dashed;

    }
    .titre-jour { 
        font-weight: bold; 
        margin-bottom: 10px; 
        color: #333; }
    .raccourci { 
        color: #d32f2f; 
        font-weight: bold; 
        font-size: 1.2em; 
        margin-bottom: 5px; }
</style>
</head>
<body>
    <div class="en-tete">
    <h2 id="titre-mois">Calendrier</h2>
</div>

<div class="grille" id="grille-calendrier">
</div class ="case-jour">Chargement en cours...</div> 
    <!-- Les cases seront générées ici par le script -->
</div>

<script>
    // 2. Attendre que l'API Grist soit prête
    grist.ready({requiredAccess: 'full'});

    async function chargerCalendrie(){
        try{

        const planningData = await grist.docApi.fetchTable('PlannigDiffusion');
         const raccourcisData = await grist.docApi.fetchTable('Raccourcis');

         const raccourcisMap = {};
         if (raccourcisData){
            raccourcisData.forEach(r=>{
                reccourcisMap[r.id]= r;
            });
        
        }

                    // 2. Fixer la période à NOVEMBRE 2026
            const anneeActuelle = 2026;
            const moisCible = 10; // En JavaScript, les mois vont de 0 à 11 (0 = Janvier, 10 = Novembre)

            const aujourdhui = new Date();
            aujourdhui.setHours(0,0,0,0);

            const moisNoms = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
            document.getElementById('titre-mois').innerText = moisNoms[moisCible] + " " + anneeActuelle;

            const conteneurGrille = document.getElementById('grille-calendrier');
            conteneurGrille.innerHTML = "";

            // Nombre de jours dans le mois de Novembre
            const dernierJourDuMois = new Date(anneeActuelle, moisCible + 1, 0).getDate();
            let joursSemaine = ["Dim", "Lun", "Mar", "Mer", "Jeu", "Ven", "Sam"];

            let indexRaccourci = 0;

            // 3. Boucle sur chaque jour du mois de Novembre
            for (let jour = 1; jour <= dernierJourDuMois; jour++) {
                const dateCourante = new Date(anneeActuelle, moisCible, jour);
                dateCourante.setHours(0,0,0,0);

                // Ignorer les week-ends (Samedi = 6, Dimanche = 0)
                const jourSemaineNum = dateCourante.getDay();
                if (jourSemaineNum === 0 || jourSemaineNum === 6) continue;


        const caseDiv = document.createElement('div');
        let statutClasse = "case-jour";
        if (dateCourante.getTime() <aujourdhui.getTime()){
            statutClasse += "passe";

        }else if (dateCourante.getTime() === aujourdhui.getTime()){
            statutClasse += "aujourdhui";
        }else {
            statutClasse+= "futur";
        }
        caseDiv.className = statutClasse;

        let jourTexte = joursSemaine[joursSemaineNum]  + " " + jour;
        let htmlContent = '<div class ="titre-jour">${jourTeste}</div>';
        let planningTrouve = null;
        if (planningData) {
            planningTrouve = planningData.find(p=> {
                if (!p.Date_Diffusion && !p.DateDiffusion) return false;
                let dVal = p.Date_Diffusion || p.DateDiffusion;
                let timestamp = typeof dVal === "number" ? dVal * 1000 : new Date(dVal).getTime(); 
                let dDate = new Date(timestamp);
                dDate.setHours(0,0,0,0);
                return dDate.getTime() === dateCourante.getTime();

            });

        }

        if (planningTrouve) {
            const rId = planningTrouve.RaccouciID || planningTrouve.Raccouci_Cible || planningTrouve.Raccourci;
            const raccourciObj = raccourcisMap[rId];
            if(raccourciObj){
                const combi = raccourciObj.Combinaison || "Raccourci";
                const desc = raccourciObj.Description || raccourciObj.Remarque|| "";
                htmlContent += '<div class ="raccourci">${combi}</div>' + '<div style = "font-size : 0.85; color: #555;">${desc}</div>';

            }else {
                htmlContent += '<div style= "font-style : italic ; color: #888;"> Assigné (ID : ${rId}</div>';

            }

        }else {
            if (dateCourante.getTime()> aujourdhui.getTime()){
                htmlContent += '<div style= "font-style : italic ; color: #888;"> Verrouillé </div>';

            }else{
               htmlContent += '<div style= "font-style : italic ; color: #888;"> Aucun raccourci  </div>'; 
            }
        }
        caseDiv.innerHTML = htmlContent;
        conteneurGrille.appendChild(caseDiv);


        
       }

    
        
    }catch (error) {
        console.error("Erreur de chargement :" , error);
        document.getElementById('grille-calendrier').innerHTML = "<p>Erreur de lecture des tables Grist.</p>";
    }

    }
    chergerClendrier();
     </script>
        </body>
        </html>
